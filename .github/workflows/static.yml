# Build the site (Markdown + JSON -> static HTML) and deploy it to GitHub Pages.
name: Build and deploy to Pages

on:
  push:
    branches: ["main"]
  pull_request:          # build-only check on PRs, no deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Satoshi font (optional; kept out of the public repo, see SITE.md)
        env:
          PART1: ${{ secrets.SATOSHI_WOFF2_B64_1 }}
          PART2: ${{ secrets.SATOSHI_WOFF2_B64_2 }}
        run: |
          if [ -n "$PART1" ]; then
            printf '%s%s' "$PART1" "$PART2" | base64 -d > src/assets/fonts/Satoshi-Variable.woff2
            echo "Satoshi installed for this build"
          else
            echo "No Satoshi secrets set; the site will use Tajawal for headings"
          fi
      - run: npm run build
      - run: npm run check
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist   # only the built site is published, never the repository root

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
