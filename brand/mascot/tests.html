<!doctype html><html lang="en"><meta charset="utf-8"><title>Mascot tests</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;font-family:Tajawal,system-ui,sans-serif;background:#111;color:#fff}
h1{font-size:24px;margin:0 0 4px}.sub{color:#a6a6a6;margin:0 0 24px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1200px}
.t{border-radius:20px;padding:16px;display:grid;gap:10px;justify-items:center}.t b{font-size:13px;font-weight:500}
.t img{height:150px}.w{background:#fff;color:#000}.k{background:#000}.y{background:#ffcc00;color:#000}.m{background:#8a8a8a;color:#000}
.s{grid-column:1/-1;background:#1b1b1b;display:flex;align-items:flex-end;gap:22px;justify-content:flex-start;padding:20px}
.s div{display:grid;gap:6px;justify-items:center;font-size:11px;color:#a6a6a6}
.blur img{filter:blur(4px)}.th img{filter:grayscale(1) contrast(40) brightness(1.1)}
</style><body><h1>Mascot logo tests</h1><p class="sub">Single colour, reversal, on colour, blur, threshold, and small sizes.</p>
<div class="g">
<div class="t w"><img src="am-mascot-mono.svg"><b>Black on white (tie in ink)</b></div>
<div class="t k"><img src="am-mascot.svg"><b>Reversed on black</b></div>
<div class="t y"><img src="am-mascot-mono.svg"><b>On yellow</b></div>
<div class="t m"><img src="am-mascot-mono.svg"><b>On mid grey</b></div>
<div class="t w blur"><img src="am-mascot-mono.svg"><b>Blur (squint test)</b></div>
<div class="t w th"><img src="am-mascot-mono.svg"><b>1-bit threshold</b></div>
<div class="t k"><img src="am-lockup-white.svg" style="height:70px"><b>Lockup on black</b></div>
<div class="t w"><img src="am-lockup.svg" style="height:70px"><b>Lockup on white</b></div>
<div class="t s"><div><img src="am-mascot-head.svg" width="128"><span>head 128</span></div><div><img src="am-mascot-head.svg" width="64"><span>64</span></div><div><img src="am-mascot-head.svg" width="46"><span>46 (header)</span></div><div><img src="am-mascot-head.svg" width="32"><span>32</span></div><div><img src="am-icon.svg" width="128"><span>icon 128</span></div><div><img src="am-icon.svg" width="64"><span>64</span></div><div><img src="am-icon.svg" width="32"><span>32</span></div><div><img src="am-icon.svg" width="16"><span>16</span></div><div><img src="am-avatar.svg" width="96"><span>avatar</span></div></div>
</div></body></html>
